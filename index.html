<!DOCTYPE html>
<html>
<head>
    <title>Credit Score Predictor</title>
</head>
<body>
    <h1>Credit Score Prediction Form</h1>
    <form action="/predict" method="post">
        <label for="Age">Age:</label>
        <input type="number" name="Age" required><br>

        <label for="Annual_Income">Annual Income:</label>
        <input type="number" step="0.01" name="Annual_Income" required><br>

        <label for="Monthly_Inhand_Salary">Monthly In-hand Salary:</label>
        <input type="number" step="0.01" name="Monthly_Inhand_Salary" required><br>

        <label for="Num_Bank_Accounts">Number of Bank Accounts:</label>
        <input type="number" name="Num_Bank_Accounts" required><br>

        <label for="Num_Credit_Card">Number of Credit Cards:</label>
        <input type="number" name="Num_Credit_Card" required><br>

        <label for="Interest_Rate">Interest Rate:</label>
        <input type="number" step="0.01" name="Interest_Rate" required><br>

        <label for="Num_of_Loan">Number of Loans:</label>
        <input type="number" name="Num_of_Loan" required><br>

        <label for="Delay_from_due_date">Delay from Due Date:</label>
        <input type="number" name="Delay_from_due_date" required><br>

        <label for="Num_of_Delayed_Payment">Number of Delayed Payments:</label>
        <input type="number" name="Num_of_Delayed_Payment" required><br>

        <label for="Changed_Credit_Limit">Changed Credit Limit:</label>
        <input type="number" name="Changed_Credit_Limit" required><br>

        <label for="Num_Credit_Inquiries">Number of Credit Inquiries:</label>
        <input type="number" name="Num_Credit_Inquiries" required><br>

        <label for="Credit_Mix">Credit Mix:</label>
        <input type="number" name="Credit_Mix" required><br>

        <label for="Outstanding_Debt">Outstanding Debt:</label>
        <input type="number" step="0.01" name="Outstanding_Debt" required><br>

        <label for="Credit_Utilization_Ratio">Credit Utilization Ratio:</label>
        <input type="number" step="0.01" name="Credit_Utilization_Ratio" required><br>

        <label for="Credit_History_Age">Credit History Age:</label>
        <input type="number" name="Credit_History_Age" required><br>

        <label for="Payment_of_Min_Amount">Payment of Minimum Amount:</label>
        <input type="number" name="Payment_of_Min_Amount" required><br>

        <label for="Total_EMI_per_month">Total EMI per Month:</label>
        <input type="number" step="0.01" name="Total_EMI_per_month" required><br>

        <label for="Amount_invested_monthly">Amount Invested Monthly:</label>
        <input type="number" step="0.01" name="Amount_invested_monthly" required><br>

        <label for="Payment_Behaviour">Payment Behaviour:</label>
        <input type="number" name="Payment_Behaviour" required><br>

        <label for="Monthly_Balance">Monthly Balance:</label>
        <input type="number" step="0.01" name="Monthly_Balance" required><br>

        <button type="submit">Predict Credit Score</button>
    </form>
</body>
</html>
