<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Score Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #10b981;
            --dark-green: #059669;
            --primary-red: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            position: relative;
        }

        /* Top decorative bar representing Credit Score Range */
        .status-bar {
            height: 8px;
            width: 100%;
            background: linear-gradient(90deg, var(--primary-red) 0%, #f59e0b 50%, var(--primary-green) 100%);
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin: 30px 0 10px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        form {
            padding: 0 40px 40px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        /* Responsive Grid for Desktop */
        @media (min-width: 768px) {
            form {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #4b5563;
        }

        input {
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-green);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        /* Button Styling */
        button {
            grid-column: 1 / -1; /* Spans full width */
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Prediction Result Styling */
        .result-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #ecfdf5;
            border: 1px solid var(--primary-green);
            border-radius: 8px;
            text-align: center;
            color: var(--dark-green);
            animation: fadeIn 0.5s ease;
        }

        .result-container h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .result-container p {
            font-size: 1.5rem;
            font-weight: 700;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="status-bar"></div>
        
        <h1>Credit Score Predictor</h1>
        <p class="subtitle">Enter your financial details below to calculate your likely score.</p>

        <form action="/predict" method="post">
            <div class="form-group">
                <label for="Age">Age</label>
                <input type="number" name="Age" placeholder="e.g. 30" required>
            </div>

            <div class="form-group">
                <label for="Annual_Income">Annual Income ($)</label>
                <input type="number" step="0.01" name="Annual_Income" placeholder="e.g. 50000" required>
            </div>

            <div class="form-group">
                <label for="Monthly_Inhand_Salary">Monthly In-hand Salary ($)</label>
                <input type="number" step="0.01" name="Monthly_Inhand_Salary" required>
            </div>

            <div class="form-group">
                <label for="Num_Bank_Accounts">Number of Bank Accounts</label>
                <input type="number" name="Num_Bank_Accounts" required>
            </div>

            <div class="form-group">
                <label for="Num_Credit_Card">Number of Credit Cards</label>
                <input type="number" name="Num_Credit_Card" required>
            </div>

            <div class="form-group">
                <label for="Interest_Rate">Interest Rate (%)</label>
                <input type="number" step="0.01" name="Interest_Rate" required>
            </div>

            <div class="form-group">
                <label for="Num_of_Loan">Number of Loans</label>
                <input type="number" name="Num_of_Loan" required>
            </div>

            <div class="form-group">
                <label for="Delay_from_due_date">Delay from Due Date (Days)</label>
                <input type="number" name="Delay_from_due_date" required>
            </div>

            <div class="form-group">
                <label for="Num_of_Delayed_Payment">Number of Delayed Payments</label>
                <input type="number" name="Num_of_Delayed_Payment" required>
            </div>

            <div class="form-group">
                <label for="Changed_Credit_Limit">Changed Credit Limit</label>
                <input type="number" name="Changed_Credit_Limit" required>
            </div>

            <div class="form-group">
                <label for="Num_Credit_Inquiries">Number of Credit Inquiries</label>
                <input type="number" name="Num_Credit_Inquiries" required>
            </div>

            <div class="form-group">
                <label for="Credit_Mix">Credit Mix (Numeric Score)</label>
                <input type="number" name="Credit_Mix" required>
            </div>

            <div class="form-group">
                <label for="Outstanding_Debt">Outstanding Debt ($)</label>
                <input type="number" step="0.01" name="Outstanding_Debt" required>
            </div>

            <div class="form-group">
                <label for="Credit_Utilization_Ratio">Credit Utilization Ratio</label>
                <input type="number" step="0.01" name="Credit_Utilization_Ratio" required>
            </div>

            <div class="form-group">
                <label for="Credit_History_Age">Credit History Age (Months)</label>
                <input type="number" name="Credit_History_Age" required>
            </div>

            <div class="form-group">
                <label for="Payment_of_Min_Amount">Payment of Min Amount (0 or 1)</label>
                <input type="number" name="Payment_of_Min_Amount" required>
            </div>

            <div class="form-group">
                <label for="Total_EMI_per_month">Total EMI per Month ($)</label>
                <input type="number" step="0.01" name="Total_EMI_per_month" required>
            </div>

            <div class="form-group">
                <label for="Amount_invested_monthly">Amount Invested Monthly ($)</label>
                <input type="number" step="0.01" name="Amount_invested_monthly" required>
            </div>

            <div class="form-group">
                <label for="Payment_Behaviour">Payment Behaviour (Score)</label>
                <input type="number" name="Payment_Behaviour" required>
            </div>

            <div class="form-group">
                <label for="Monthly_Balance">Monthly Balance ($)</label>
                <input type="number" step="0.01" name="Monthly_Balance" required>
            </div>

            <button type="submit">Predict Credit Score</button>
            
            
            <div class="result-container full-width">
                <h2>Prediction Result:</h2>
                <p> prediction </p>
            
        </form>
    </div>

</body>
</html>
